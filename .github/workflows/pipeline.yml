name: Pipeline

# Corre el ciclo completo (predicción -> resultado real -> métricas ->
# disparador de reentrenamiento) sin intervención humana, sobre todos los
# activos de src/config.py, usando el punto de entrada único run_pipeline.py.
#
# GitHub Actions en vez de cron local o Airflow: es gratuito (2,000 min/mes
# en repos privados), no depende de que tu PC esté encendida, queda
# versionado junto al código y envía un correo automático si un job falla.

on:
  schedule:
    # Anomalías: cada hora, ~horario de mercado US (13-21 UTC), lun-vie.
    # Antes era cada 15 min, pero GitHub solo disparaba 1 a 3 corridas al
    # día (109 en 48 días): los cron densos se omiten bajo carga. El minuto
    # 7 evita la hora en punto, la más saturada. Cada corrida recupera las
    # velas de 5 min que no vio (hasta 5 días), así que no se pierde señal.
    - cron: "7 13-21 * * 1-5"
    # GARCH: 00:30 UTC mar-sáb, cuando ya cerraron las velas diarias del día
    # anterior tanto de índices US como de FX (ver DAILY_BAR_FINAL_AFTER en
    # src/config.py). A las 22:00 UTC la vela FX del día aún no es final.
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      signals:
        description: "Señales a ejecutar"
        type: choice
        options: ["anomaly garch", "anomaly", "garch"]
        default: "anomaly garch"

# Un solo ciclo a la vez: todos escriben en la misma data/pipeline.db.
concurrency:
  group: pipeline-db
  cancel-in-progress: false

# Sin permisos por defecto; solo el job que versiona la base escribe.
permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin credenciales en .git/config: la llave del bot solo aparece
          # en el paso que empuja (.github/scripts/bot_push.sh).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # Versiones fijadas (uv pip compile, Linux/py3.12) para builds reproducibles.
      - run: pip install -r requirements.lock

      - name: Elegir señal según el disparador
        id: select
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          MANUAL_SIGNALS: ${{ inputs.signals }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "signals=$MANUAL_SIGNALS" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 0 * * 2-6" ]; then
            echo "signals=garch" >> "$GITHUB_OUTPUT"
          else
            echo "signals=anomaly" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar pipeline
        env:
          PIPELINE_ALERT_WEBHOOK_URL: ${{ secrets.PIPELINE_ALERT_WEBHOOK_URL }}
          SIGNALS: ${{ steps.select.outputs.signals }}
        run: python run_pipeline.py --signals $SIGNALS

      # Se ejecuta aunque algún activo haya fallado: lo que sí se procesó
      # queda registrado, y el job igual aparece en rojo por el paso anterior.
      - name: Versionar la base de datos actualizada
        id: commit
        if: ${{ !cancelled() }}
        env:
          SIGNALS: ${{ steps.select.outputs.signals }}
        run: |
          git config user.name "trading-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          commit_db() {
            git add data/pipeline.db
            git diff --cached --quiet && return 1
            git commit -m "data: ciclo $SIGNALS $(date -u +%Y-%m-%dT%H:%MZ)"
          }
          commit_db || exit 0
          # Si alguien empujó a main durante la corrida hay que ponerse al
          # día. Un cambio de código se rebasa solo; si también cambió la
          # base (binaria, no se puede fusionar) se repite el ciclo sobre
          # la de main en vez de perderlo.
          if ! git pull --rebase --autostash; then
            git rebase --abort
            git reset --hard origin/main
            python run_pipeline.py --signals $SIGNALS || true
            commit_db || exit 0
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"

      - name: Empujar con la llave del bot
        if: ${{ !cancelled() && steps.commit.outputs.push == 'true' }}
        env:
          BOT_DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_KEY }}
        run: .github/scripts/bot_push.sh
