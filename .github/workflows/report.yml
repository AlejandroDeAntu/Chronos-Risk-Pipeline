name: Reporte semanal

# Cada lunes genera el reporte de volatilidad y riesgo (HTML autocontenido,
# PDF y PNG) con datos frescos y lo publica como artifact del run. Además:
# - muestra el resumen semanal (weekly.md) en la página del run;
# - versiona ese resumen en docs/semanal/ para leerlo directo en GitHub;
# - agrega la foto de métricas de la semana a data/weekly_snapshots.jsonl,
#   que el reporte del lunes siguiente usa para comparar semana a semana.

on:
  schedule:
    # Lunes 01:00 UTC: velas diarias del viernes ya finalizadas (índices y FX).
    - cron: "0 1 * * 1"
  workflow_dispatch:

# Comparte grupo con pipeline.yml: ambos hacen commit en main.
concurrency:
  group: pipeline-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Historial completo: el avance del proyecto se mide con git log.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Versiones fijadas (uv pip compile, Linux/py3.12) para builds reproducibles.
      - run: pip install -r requirements.lock

      - name: Generar reporte
        run: python run_pipeline.py --mode report

      # Se publica aunque algún activo falle: el reporte incluye la
      # sección de errores y el resto de los activos sigue siendo útil.
      - name: Publicar reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-volatilidad-${{ github.run_number }}
          path: reports/report_*/
          retention-days: 90
          if-no-files-found: error

      - name: Resumen en la página del run
        if: ${{ !cancelled() }}
        run: cat reports/report_*/weekly.md >> "$GITHUB_STEP_SUMMARY"

      - name: Versionar resumen y foto semanal
        if: ${{ !cancelled() }}
        run: |
          day=$(date -u +%Y-%m-%d)
          mkdir -p docs/semanal
          cp reports/report_*/weekly.md "docs/semanal/$day.md"
          cat reports/report_*/snapshot.json >> data/weekly_snapshots.jsonl
          git config user.name "trading-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "docs/semanal/$day.md" data/weekly_snapshots.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "docs: resumen semanal $day"
          git pull --rebase --autostash
          git push
