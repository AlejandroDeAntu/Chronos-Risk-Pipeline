name: Reporte semanal

# Genera el reporte de volatilidad y riesgo (HTML autocontenido, PDF y PNG)
# con datos frescos y lo publica como artifact descargable del run. No se
# commitea: los reportes son derivados y reproducibles con el mismo comando.

on:
  schedule:
    # Lunes 01:00 UTC: velas diarias del viernes ya finalizadas (índices y FX).
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # Versiones fijadas (uv pip compile, Linux/py3.12) para builds reproducibles.
      - run: pip install -r requirements.lock

      - name: Generar reporte
        run: python run_pipeline.py --mode report

      # Se publica aunque algún activo falle: el reporte incluye la
      # sección de errores y el resto de los activos sigue siendo útil.
      - name: Publicar reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-volatilidad-${{ github.run_number }}
          path: reports/report_*/
          retention-days: 90
          if-no-files-found: error
