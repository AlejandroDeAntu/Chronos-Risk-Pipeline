name: CI

# Verificación objetiva de calidad en cada push o pull request: estilo PEP8
# (79 columnas), type hints, docstrings, excepciones no genéricas (Ruff) y la
# suite de pytest. Los commits automáticos de datos que hace pipeline.yml con
# GITHUB_TOKEN no disparan este workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # Versiones fijadas (uv pip compile, Linux/py3.12) para builds reproducibles.
      - run: pip install -r requirements-dev.lock

      - name: Lint (Ruff)
        run: ruff check .

      - name: Formato (Ruff)
        run: ruff format --check .

      - name: Pruebas (pytest) con cobertura mínima de 80%
        run: pytest -q --cov=src --cov-fail-under=80
