name: Reporte semanal del modelo

# Cada viernes a las 21:00 de Ciudad de México (UTC-6 fijo, sin horario de
# verano) resume cuánto mejoró el modelo frente a su baseline durante la
# semana (src/reporting/weekly_ml.py), commitea reports/weekly/AAAA-MM-DD.md
# y abre un Issue con el mismo contenido para que llegue por notificación.
# GitHub puede retrasar los cron programados (en este repo, hasta ~6 h).

on:
  schedule:
    - cron: "0 3 * * 6" # sábado 03:00 UTC = viernes 21:00 CDMX
  workflow_dispatch:

# Lee la misma base que escribe pipeline.yml: nunca en paralelo.
concurrency:
  group: pipeline-db
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sin credenciales en .git/config: la llave del bot solo aparece
          # en el paso que empuja (.github/scripts/bot_push.sh).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.lock

      - name: Generar reporte
        id: report
        run: |
          # Solo la última línea de stdout es la ruta; se valida su forma
          # antes de usarla como salida del paso.
          path="$(python -m src.reporting.weekly_ml | tail -n 1)"
          case "$path" in
            reports/weekly/*.md) echo "path=$path" >> "$GITHUB_OUTPUT" ;;
            *) echo "Ruta de reporte inesperada: $path" >&2; exit 1 ;;
          esac

      - name: Versionar el reporte
        id: commit
        env:
          REPORT: ${{ steps.report.outputs.path }}
        run: |
          git config user.name "trading-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$REPORT"
          git diff --cached --quiet && exit 0
          git commit -m "docs: reporte semanal del modelo $(basename "$REPORT" .md)"
          git pull --rebase --autostash
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Empujar con la llave del bot
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          BOT_DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_KEY }}
        run: .github/scripts/bot_push.sh

      # Solo si hubo reporte nuevo: relanzar el mismo día no duplica el Issue.
      - name: Abrir Issue con el resumen
        if: ${{ steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.report.outputs.path }}
        run: >-
          gh issue create
          --title "Reporte semanal del modelo $(basename "$REPORT" .md)"
          --body-file "$REPORT"
