# Mantiene al dia los SHA fijados de las GitHub Actions (seguridad de la
# cadena de suministro: un tag se puede mover, un SHA no).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Rangos de requirements*.txt. Los .lock con hashes no los regenera
  # Dependabot: tras aceptar un PR, correr el `uv pip compile` del README.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
